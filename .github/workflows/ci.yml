name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ci, not install: the declared ranges are what a fresh clone resolves,
      # and a floor that cannot serve a bulk KV read has broken both list pages
      # before.
      - run: npm ci

      - run: npm run typecheck

      - run: npm test
