name = "oshi-short-url"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# s.oshi.tw is served through a custom domain, and /admin is gated by
# Cloudflare Access on that hostname. A workers.dev hostname would answer the
# same Worker without that gate, so keep it off.
workers_dev = false

[vars]
ADMIN_EMAILS = "z54981220@gmail.com"

[observability]
[observability.logs]
enabled = true
invocation_logs = true

[[kv_namespaces]]
binding = "OSHI_SHORT_URLS"
id = "855beb8f5a4344f7b891ecf28e48822d"
preview_id = "48c152d10c4940e38aa26a66e359a0f8"
